# host/mqtt/mosquitto_test.conf - MQTT 测试实例模板（run_broker.sh 用）
# 只监听车载以太网口，避免把 1883 暴露到内网/外网；匿名登录仅用于台架联调。
listener 1883 @BIND_IP@
allow_anonymous true
persistence false
log_dest file @LOG@
log_type all
log_timestamp true
max_queued_messages 10000
# 关键：mosquitto 到订阅者的 socket 默认走 Nagle；小报文（MQTT PUBLISH 几十字节）
# + 对端 Linux delayed ACK 会让 broker->订阅者这一跳卡 ~40 ms（第 38 章实测 p50=39.97 ms）。
# 打开 TCP_NODELAY 后单条往返从 41 ms 降到 ~2 ms。
set_tcp_nodelay true
